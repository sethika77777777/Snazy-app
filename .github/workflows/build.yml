name: Build Flet APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3' # Flet සමඟ හොඳින්ම වැඩ කරන ස්ථාවර Version එකක්
          channel: 'stable'
          cache: true

      - name: Install Flet CLI
        run: pip install flet

      - name: Accept Android Licenses and Build APK
        run: |
          yes | flutter doctor --android-licenses
          flet build apk --module-name app.py --yes
